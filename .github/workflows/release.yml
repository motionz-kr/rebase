name: Release

# Content-driven auto-release. On every push to main, release-please reads the
# conventional-commit history and maintains a "Release PR" (version bump +
# CHANGELOG). Merging that Release PR creates the tag + GitHub Release, which in
# the SAME run triggers the installer build. Add a `Release-Platform: mac` or
# `Release-Platform: win` commit-message trailer to build only one platform;
# without the trailer, both platforms build. Doing this in one workflow avoids
# the GITHUB_TOKEN "no recursive workflow trigger" limitation.
# workflow_dispatch supports platform selection for new releases and rebuilds.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z release tag to rebuild (leave empty to only check release-please)
        required: false
        type: string
      platform:
        description: Platform(s) to build for a release or existing-tag rebuild
        required: false
        default: both
        type: choice
        options:
          - both
          - mac
          - win

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs['.--tag_name'] }}
      build_matrix: ${{ steps.platform_matrix.outputs.include }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release platform matrix
        id: platform_matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        shell: bash
        run: |
          platform=both
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            platform="${REQUESTED_PLATFORM:-both}"
          elif grep -Fxq 'Release-Platform: mac' <<< "$RELEASE_MESSAGE"; then
            platform=mac
          elif grep -Fxq 'Release-Platform: win' <<< "$RELEASE_MESSAGE"; then
            platform=win
          elif grep -Fxq 'Release-Platform: both' <<< "$RELEASE_MESSAGE"; then
            platform=both
          fi

          case "$platform" in
            mac)
              include='{"include":[{"os":"macos-14","platform":"mac","goos":"darwin","goarch":"arm64"}]}'
              ;;
            win)
              include='{"include":[{"os":"windows-latest","platform":"win","goos":"windows","goarch":"amd64"}]}'
              ;;
            both)
              include='{"include":[{"os":"macos-14","platform":"mac","goos":"darwin","goarch":"arm64"},{"os":"windows-latest","platform":"win","goos":"windows","goarch":"amd64"}]}'
              ;;
            *)
              echo "::error::Unsupported release platform: $platform"
              exit 1
              ;;
          esac

          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-please.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate manual release target
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use the vX.Y.Z format"
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.9

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (renderer + desktop)
        run: |
          pnpm --filter renderer test
          pnpm --filter desktop test

      - name: Build the Go engine
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: go build -ldflags="-s -w" -o apps/desktop/bin/app-engine${{ matrix.platform == 'win' && '.exe' || '' }} ./engine/cmd/app-engine

      - name: Build renderer + desktop
        run: |
          pnpm --filter renderer build
          pnpm --filter desktop build

      - name: Package (build only, no publish)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        # This preflight exists to smoke-test the packaged macOS app before
        # signing/notarization. Windows has no matching smoke-test, so its
        # publish step is the only packaging pass.
        # Build the macOS zip independently from the DMG. GitHub's macOS
        # runners intermittently fail DMG creation with "hdiutil: ... Device
        # not configured". A DMG failure must not prevent the zip and updater
        # metadata from being published.
        run: |
          set -o pipefail

          cleanup_mac_volumes() {
            for v in $(ls /Volumes 2>/dev/null | grep -i '^Rebase' || true); do
              hdiutil detach "/Volumes/$v" -force 2>/dev/null || true
            done
          }

          retry_builder() {
            local label="$1"; shift
            local attempt=1; local max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::electron-builder ($label) failed after $max attempts"
                return 1
              fi
              echo "::warning::electron-builder ($label) attempt $attempt failed; cleaning up, retrying in 15s"
              cleanup_mac_volumes
              attempt=$((attempt + 1))
              sleep 15
            done
          }

          # DMG is best-effort; the zip is the required macOS distribution
          # artifact and is also the updater's preferred package.
          if ! retry_builder "mac DMG package" pnpm exec electron-builder --mac dmg --publish never; then
            echo "::warning::macOS DMG packaging failed; continuing with zip-only release"
          fi
          retry_builder "mac zip package" pnpm exec electron-builder --mac zip --publish never

      # Smoke-test the packaged app: launch it and fail if the main process
      # can't load a bundled module. This catches dependency-bundling regressions
      # (e.g. a transitive dep missing from the asar) that a plain build does not.
      - name: Smoke-test the packaged app (mac)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          APP="apps/desktop/release/mac-arm64/Rebase.app/Contents/MacOS/Rebase"
          "$APP" > /tmp/smoke.log 2>&1 &
          PID=$!
          sleep 12
          kill -9 "$PID" 2>/dev/null || true
          echo "--- app log ---"
          cat /tmp/smoke.log || true
          if grep -q "Cannot find module" /tmp/smoke.log; then
            echo "::error::Packaged app is missing a bundled module"
            exit 1
          fi
          echo "Smoke test passed: no missing modules"

      # Inject signing/notarization env only where it applies. CSC_LINK / CSC_KEY_PASSWORD
      # are generic (mac AND win) electron-builder vars; setting them to an EMPTY string
      # on Windows makes electron-builder treat "" as a bad cert path and fail
      # (`Env WIN_CSC_LINK is not correct, cannot resolve ...`). Empty != unset. So set
      # them via $GITHUB_ENV on mac only, and never set CSC_LINK on Windows (win stays
      # unsigned, as before). Built-in electron-builder notarization is disabled in
      # electron-builder.json; our afterSign hook handles notarization so plain-text
      # notarytool HTTP errors can be retried and reported clearly. The multi-line
      # base64 .p12 is written with the $GITHUB_ENV heredoc form.
      - name: Prepare signing env
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          MAC_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/authkey.p8"
            {
              echo "APPLE_API_KEY=$RUNNER_TEMP/authkey.p8"
              echo "APPLE_API_KEY_ID=$MAC_APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$MAC_APPLE_API_ISSUER"
              echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD"
              echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
              echo "REBASE_NOTARIZE=1"
              echo "CSC_LINK<<__CSC_EOF__"
              printf '%s\n' "$MAC_CSC_LINK"
              echo "__CSC_EOF__"
            } >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      - name: Publish (${{ matrix.platform }})
        working-directory: apps/desktop
        env:
          # The repo is public, so the built-in token can publish releases to it.
          # Signing/notarization vars come from the "Prepare signing env" step
          # ($GITHUB_ENV), set on mac only — never as empty strings on Windows.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        # Publish the macOS DMG on a best-effort basis, then publish the zip last
        # so latest-mac.yml points at the updater-compatible zip even if DMG
        # creation remains flaky. Re-uploading an existing asset is safe because
        # electron-builder's GitHub publisher replaces it.
        run: |
          set -o pipefail

          cleanup_mac_volumes() {
            if [ "${{ matrix.platform }}" = "mac" ]; then
              for v in $(ls /Volumes 2>/dev/null | grep -i '^Rebase' || true); do
                hdiutil detach "/Volumes/$v" -force 2>/dev/null || true
              done
            fi
          }

          retry_builder() {
            local label="$1"; shift
            local attempt=1; local max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::electron-builder ($label) failed after $max attempts"
                return 1
              fi
              echo "::warning::electron-builder ($label) attempt $attempt failed; cleaning up, retrying in 15s"
              cleanup_mac_volumes
              attempt=$((attempt + 1))
              sleep 15
            done
          }

          if [ "${{ matrix.platform }}" = "mac" ]; then
            if ! retry_builder "mac DMG publish" pnpm exec electron-builder --mac dmg --publish always; then
              echo "::warning::macOS DMG publish failed; continuing with zip-only release"
            fi
            retry_builder "mac zip publish" pnpm exec electron-builder --mac zip --publish always
          else
            retry_builder "windows publish" pnpm exec electron-builder --win --publish always
          fi
